{# 학생: 6자리 코드로 리그 들어가기 #}
<!-- (가-2) 학생: 코드 입력 -->
<div id="joinView" class="hidden">
  <button type="button" class="btn-small btn back-link back-choose">← 뒤로가기</button>
  <div class="card">
    <h2>리그 들어가기 🎟️</h2>
    <p class="hint">관리자에게 받은 6자리 코드를 넣어 주세요.</p>
    <form id="joinForm">
      <label for="joinCode" class="sr-only">6자리 리그 코드</label>
      <input type="text" id="joinCode" inputmode="numeric" maxlength="6" autocomplete="off" pattern="[0-9]{6}"
             placeholder="예: 634322" />
      <button type="submit" class="btn">입장하기</button>
      <p id="joinMsg" class="msg"></p>
    </form>
  </div>
</div>
