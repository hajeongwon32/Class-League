{# 로그인 후 첫 화면: 학생/관리자 고르기 #}
<!-- (가-1) 첫 화면: 학생 / 관리자 고르기 -->
<div id="chooseView">
  <div class="card choose-head">
    <h2>무엇을 할까요?</h2>
    <p class="hint">코드로 들어가면 학생, 리그를 만들면 관리자가 돼요. 들어가기 전까지는 다시 고를 수 있어요.</p>
  </div>
  <div class="portal-grid">
    <!-- 버튼 안이라 목록은 span으로 만든다 (button 안에는 ul을 넣을 수 없음) -->
    <button type="button" class="portal portal-student" data-go="join">
      <span class="portal-role">학생</span>
      <span class="portal-name">리그 들어가기</span>
      <span class="portal-list">
        <span>상대에게 낼 문제를 만들어요</span>
        <span>상대 문제를 풀고 승점을 쌓아요</span>
        <span>틀린 문제는 오답 노트로 복습해요</span>
      </span>
      <span class="portal-need">관리자에게 받은 6자리 코드가 필요해요</span>
      <span class="portal-go">코드 넣고 들어가기 →</span>
    </button>
    <button type="button" class="portal portal-admin" data-go="create">
      <span class="portal-role">관리자</span>
      <span class="portal-name">리그 만들기</span>
      <span class="portal-list">
        <span>과목과 일정을 정해 리그를 만들어요</span>
        <span>라운드별 출제 범위와 신고를 관리해요</span>
        <span>진행 상황과 순위, 정답률을 봐요</span>
      </span>
      <span class="portal-need">누구나 만들 수 있어요. 만든 사람은 선수로는 참가하지 않아요</span>
      <span class="portal-go">리그 만들기 →</span>
    </button>
  </div>
  <div id="pastLink" class="card past-link hidden">
    <p id="pastLinkText"></p>
    <button type="button" id="openPastBtn" class="btn btn-outline">📚 지난 리그 보기</button>
  </div>
</div>
